<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 1</title>
    
</head>
<body>

<form action="#"method="post">

    <label for="nome">Nome:</label>
    <input type="text" id="nome" placeholder="Seu nome.." required>
    <br><br>
    <label for="email">Email:</label>
    <input type="text" id="email" placeholder="seuemail@gmail.com">
    <br><br>
    <label for="senha">Senha:</label>
    <input type="password" id="senha" required> 
        <br><br>
    <label for="mensagem">Mensagem:</label>
    <textarea name="Mensagem" id="Mensagem" cols="50" rows="4" placeholder="Escreva aqui.."></textarea>
    <br><br>
    <label for="cidade">Cidade:</label>
    <select name="cidade" id="cidade">
        <option value="">Selecione..</option>
        <option value="nh">Novo Hamburgo</option>
        <option value="sl">São Leopoldo</option>
        <option value="cb">Campo Bom</option>
        <option value="mn">Montenegro</option>
        </select>
        <fieldset>
            <legend>Gênero:</legend>
            <input type="radio" id="masc" name="genero" value="M">
            <label for="masc">Masculino</label>
            <input type="radio" id="fem"name="genero" value="F">
            <label for="fem">Feminino</label>
        </fieldset>



</main>
</body>
</html>
