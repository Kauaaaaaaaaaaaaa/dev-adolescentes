<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula com CSS</title>
    <link rel="stylesheet" href="/style.css">

</head>
<body>
        <h1>Cadastro de alunos</h1>
        <h2>Alunos cadastrados</h2>
        <table border="1" cellpadding="10" cellspacing="0">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Curso</th>
                    <th>Idade</th>
                    <th>Cidade</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Erick Gabriel</td>
                    <td>Desenvolvedor de Sistemas</td>
                    <td>15</td>
                    <td>Novo hamburgo</td>
                </tr>
                <tr>
                    <td>Kauã Pozzebon</td>
                    <td>Desenvolvedor de Sistemas</td>
                    <td>16</td>
                    <td>Novo Hamburgo</td>
                </tr>
                <tr>
                    <td>Lucas Apollo</td>
                    <td>Informática</td>
                    <td>14</td>
                    <td>São Leopoldo</td>
                </tr>
                <tr>
                    <td>Miguel Freitas</td>
                    <td>Desenvolvedor de Sistemas</td>
                    <td>14</td>
                    <td>São Leopoldo</td>
                </tr>
            </tbody>
        </table>
        
        <h2>Novo Cadastro</h2>
        <form action="#"method="post">
        <br><br>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <br><br>
        
        <label for="email">Email:</label>
        <br><br>
        <input type="text" id="email" placeholder="Digite seu email">
        <br><br>

        <label for="idade">Idade:</label>
        <br><br>
        <input type="number" id="idade" placeholder="Digite sua idade">
        <br><br>
        
        <label for="curso">Escolha seu curso:</label>
        <select name="curso" id="curso">
            <option value="">Selecione um curso</option>
            <option value="informatica">informatica</option>
            <option value="excel">Excel</option>
            <option value="desenvolvimento">Desenvolvimento de Sistemas</option>
        </select>
        <label for="mensagem">Observações</label>
        <textarea  id="mensagem"  rows="10"
        placeholder="Digite alguma observação"></textarea>
        
        <button type="submit">Cadastrar:</button>

    </form>
</body>
</html>
